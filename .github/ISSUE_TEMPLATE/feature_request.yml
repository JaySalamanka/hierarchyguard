name: Feature request
description: Propose a portable hierarchy-quality improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: Do not include proprietary vendor rules or customer data. Describe the general operational problem.
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
      description: What hierarchy risk or workflow gap should be addressed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Synthetic example
      render: text
  - type: checkboxes
    id: portability
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal is generic and contains no customer or proprietary vendor material.
          required: true
